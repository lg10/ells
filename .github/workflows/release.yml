name: Release
on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps (rfd→ashpd→wayland-sys 需要 libwayland-dev)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: ells-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/ells
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: ells-windows-x86_64.exe
          path: target/x86_64-pc-windows-msvc/release/ells.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Universal binary
        run: lipo -create -output ells-macos-universal target/aarch64-apple-darwin/release/ells target/x86_64-apple-darwin/release/ells
      - uses: actions/upload-artifact@v4
        with:
          name: ells-macos-universal
          path: ells-macos-universal
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      # 注意：artifact 目录内的文件名 = 上传时的源文件名（Linux 是 `ells`、Windows 是 `ells.exe`），
      # 不能假设与 artifact 同名，一律显式 find+cp 重命名。
      - name: Normalize names + checksums
        run: |
          set -eu
          mkdir -p out
          linux_file=$(find dist/ells-linux-x86_64 -type f | head -n1)
          macos_file=$(find dist/ells-macos-universal -type f | head -n1)
          windows_file=$(find dist/ells-windows-x86_64.exe -type f | head -n1)
          [ -n "$linux_file" ] && [ -n "$macos_file" ] && [ -n "$windows_file" ]
          cp "$linux_file" out/ells-linux-x86_64
          cp "$macos_file" out/ells-macos-universal
          cp "$windows_file" out/ells-windows-x86_64.exe
          ls -l out
          cd out
          sha256sum ells-linux-x86_64 ells-macos-universal ells-windows-x86_64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Release 说明直接取自 CHANGELOG.md 对应版本小节：发版前把 [未发布] 改名成
      # [x.y.z] 即可，避免手写说明和 CHANGELOG 两处对不上。小节缺失时退化成
      # 只有一键安装的说明，不出空发布。
      - name: Build release notes from CHANGELOG
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            { if (index($0, "## [" ver "]") == 1) insec = 1; else if (index($0, "## ") == 1) insec = 0 }
            insec { print }
          ' CHANGELOG.md > out/notes_body.md
          {
            printf '# ells %s\n\n' "$TAG"
            printf '### 一键安装 / Install\n\n'
            printf 'macOS / Linux：\n\n'
            printf '```bash\nELLS_VERSION=%s curl -fsSL https://raw.githubusercontent.com/lg10/ells/main/install.sh | sh\n```\n\n' "$TAG"
            printf 'Windows PowerShell：\n\n'
            printf '```powershell\n$env:ELLS_VERSION="%s"; irm https://raw.githubusercontent.com/lg10/ells/main/install.ps1 | iex\n```\n\n' "$TAG"
            printf '安装脚本会强制校验 `SHA256SUMS.txt`。产物：`ells-linux-x86_64` · `ells-macos-universal`（x86_64 + Apple Silicon 合一）· `ells-windows-x86_64.exe` · `SHA256SUMS.txt`\n\n'
            printf -- '---\n\n'
            if [ -s out/notes_body.md ]; then
              cat out/notes_body.md
            else
              printf '（CHANGELOG.md 里没找到 %s 小节，完整变更请看仓库 main 分支的 CHANGELOG.md。）\n' "$VER"
              echo "::warning::CHANGELOG 缺少 [$VER] 小节，发布说明已退化"
            fi
            printf '\n完整历史：[CHANGELOG.md](https://github.com/lg10/ells/blob/main/CHANGELOG.md) · 安全策略：[SECURITY.md](https://github.com/lg10/ells/blob/main/SECURITY.md) · 安装选项与卸载：[README](https://github.com/lg10/ells)\n'
          } > out/RELEASE_NOTES.md
          cat out/RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ells ${{ github.ref_name }}
          body_path: out/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            out/ells-linux-x86_64
            out/ells-macos-universal
            out/ells-windows-x86_64.exe
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
