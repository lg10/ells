name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ells-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: ells-macos-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: ells-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ells-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # rfd 在 Linux 走 ashpd/XDG 门户（纯 Rust），无需系统 GTK
      - name: Build (debug)
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/debug/ells${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error
