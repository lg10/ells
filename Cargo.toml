[workspace]
resolver = "2"
members = ["crates/ells-core", "crates/ells-term", "crates/ells-transfer", "crates/ells"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
zeroize = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
vt100 = "0.16"

ells-core = { path = "crates/ells-core" }
ells-term = { path = "crates/ells-term" }
ells-transfer = { path = "crates/ells-transfer" }

[profile.release]
lto = "thin"
strip = true
