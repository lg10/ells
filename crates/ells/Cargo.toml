[package]
name = "ells"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ells"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap.workspace = true
dirs.workspace = true
crossterm.workspace = true
ells-core.workspace = true
ells-term.workspace = true
ells-transfer.workspace = true
futures.workspace = true
ratatui.workspace = true
rfd = "0.15"
# 自更新：ring 只用来算 SHA256（russh 已经带了 ring，这里是显式声明直接依赖），
# ureq 关掉默认特性、只留 rustls，避免为了下载一个二进制再拖进 gzip/brotli/charset。
ring = "0.17.14"
russh.workspace = true
russh-sftp.workspace = true
# 无头 `ells list --format json` 的输出；只用到 json!/to_string，不带任何网络特性
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zeroize.workspace = true

# 仅 macOS：弹对话框前把 AppKit 正式拉起（见 dialog.rs 注释）。版本与 rfd 0.15.4
# 内部所用一致，特性取两者的交集就够用。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[build-dependencies]
chrono = "0.4"
