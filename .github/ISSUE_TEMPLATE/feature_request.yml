name: 功能建议 / Feature request
description: 提出一个新功能或改进建议 / Suggest a feature or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提建议。请说明**你想解决的问题**，而不是直接描述按钮长什么样：
        知道场景才能选出更合适的实现方式。
        Thanks — describe the problem you want solved, not the button you imagine.

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      description: |
        在什么工作流里卡住了？现在只能怎么绕过去？
        Where do you get stuck, and what is your current workaround?
      placeholder: |
        我经常要连 5 台服务器，每次都要重新解锁保险库再选主机……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的做法 / Preferred solution
      description: 你希望 ells 怎么表现，键位放在哪里，失败时怎样。
      validations:
        required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他可选方案 / Alternatives
      description: 想过但没选的做法，以及为什么不合适。
      validations:
        required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 / Area
      options:
        - 保险库 / 主密码 (vault)
        - 主机列表 / 连接 (session)
        - 终端渲染 (terminal)
        - 文件浏览器 / rz-sz (transfer)
        - 安装 / 发布 (packaging)
        - 其他 (other)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ells 版本 / Version
      description: 运行 `ells --version` 后原样粘贴。
      placeholder: "ells 0.2.0"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Confirmations
      options:
        - label: "我已搜索过相似的 enhancement issue / I searched existing feature requests"
          required: true
        - label: "本条内容不含主密码、私钥、保险库文件或真实主机地址 / Contains no master password, private keys, vault files or real host addresses"
          required: true
