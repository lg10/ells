name: "🐛 问题反馈 / Bug report"
description: 界面卡死、连接失败、sz/rz 不生效等缺陷报告
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认用的是**最新版**（`ells --version`），安装脚本会拉最新 Release。
        **请不要在 Issue 里贴主密码、私钥、`~/.ells/vault.bin` 或真实服务器地址/账号**——
        这些一旦公开就等于交出凭据。怀疑是安全问题请按 [SECURITY.md](https://github.com/lg10/ells/blob/main/SECURITY.md) 走私密通告。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 现象 + 期望。能附上截图更好。
      placeholder: 连接 demo-server 后按 Ctrl-S 打开文件浏览器，界面直接退出…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从启动 ells 开始，一步一行写清楚。
      value: |
        1. ells
        2. 
        3. 
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统 / OS
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - 其他（请在下方说明）
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: 你用的是哪个终端 / Terminal
      description: 渲染问题几乎都和终端有关
      options:
        - Windows Terminal
        - cmd.exe
        - PowerShell 控制台
        - iTerm2
        - macOS Terminal.app
        - GNOME Terminal / Konsole / 其他 Linux 终端
        - VS Code 集成终端
        - tmux / screen 里
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ells 版本
      description: 运行 `ells --version` 把输出贴过来
      placeholder: ells 0.2.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs（可选）
      description: |
        用 `ELLS_LOG=1 ells` 重启一次，把 stderr 输出贴上来。
        只有涉及 sz/rz 时才需要 `ELLS_ZMODEM_LOG=1`（会写 `~/.ells/zmodem.log`）；
        这个文件含远端输出片段，**贴之前请把主机名、路径、文件名改成假值**，
        贴完记得删掉 `~/.ells/zmodem.log`。
      render: text
  - type: textarea
    id: host-config
    attributes:
      label: 主机配置（脱敏）
      description: |
        认证方式（密码 / 私钥 / 跳板机）、服务器 sshd 大版本等。
        再次提醒：地址、用户名请写成 `example.com` / `user`。
      value: |
        认证：私钥（PKCS#8）
        跳板机：无
        远端：OpenSSH 8.9 / CentOS 7
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已升级到最新版并仍能复现
          required: true
        - label: 内容里不含主密码、私钥、保险库文件或真实主机地址
          required: true
