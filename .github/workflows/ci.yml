name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ells-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: ells-macos-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: ells-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ells-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    # 实测：mac-aarch64 构建 68 秒 + 测试 19 秒，ubuntu 整格 2 分钟（含两支 pty 守卫）。
    # 卡住的那次 mac-aarch64 在守卫这一步转了 54 分钟还没结束，而 Actions 默认上限是 6 小时 ——
    # 守卫脚本自己现在每步都有墙钟，这里再兜一层：宁可超时判失败，不许把 runner 挂到天荒地老。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux system deps (rfd→ashpd→wayland-sys 需要 libwayland-dev)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev

      - name: Build (debug)
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      # 首帧必须真的画到屏幕上。v0.2.3 就是在第一帧之前问了一次光标位置（`\x1b[6n`），
      # 而 tty 的读字节正被 crossterm 的异步事件流占着 —— 回话收不到只会超时，
      # macOS / Linux 上程序在出帧之前就退出。Windows 控制台不发转义序列，
      # 所以这两个守卫只在 unix 的两台原生跑（x86_64 mac 是交叉产物，跑不了 pty）。
      - name: pty 启动守卫（首帧不许问光标）
        if: matrix.os == 'ubuntu-22.04' || matrix.target == 'aarch64-apple-darwin'
        run: python3 tests/tty_startup.py target/${{ matrix.target }}/debug/ells

      - name: 自更新回滚 + 启动名自愈（真二进制、真 pty）
        if: matrix.os == 'ubuntu-22.04' || matrix.target == 'aarch64-apple-darwin'
        run: python3 tests/selfupdate_rollback.py target/${{ matrix.target }}/debug/ells

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/debug/ells${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error

  # workflow 文件里一个重复的映射键会让 GitHub 判定整个文件无效（PyYAML 不报错），
  # 表现为"零作业、名字是文件路径、立刻失败"的运行——发布就是这么静默没跑的，
  # 所以这里用严格 loader 把它变成普通测试失败。
  workflows-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Validate workflow / issue-form YAML
        run: python3 tools/check-workflow-keys.py .github

  # 用 macOS 自带 /bin/sh（GNU bash 3.2）在 LC_ALL=C 下真跑一遍安装 + 卸载：
  # C locale 会复现"展开后紧跟多字节字符被并入变量名"这类老 shell 崩溃
  install-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell expansions
        run: node tools/check-shell-expansions.js install.sh uninstall.sh diagnose.sh
      - name: Fake release server + install/uninstall via /bin/sh (C locale)
        run: |
          set -eu
          mkdir -p fake/v0.0.0-test
          printf 'fake-macos-binary' > fake/v0.0.0-test/ells-macos-universal
          (cd fake/v0.0.0-test && echo "$(shasum -a 256 < ells-macos-universal)  ells-macos-universal" > SHA256SUMS.txt)
          (cd fake && python3 -m http.server 18098 >/dev/null 2>&1 &)
          sleep 1
          FAKE_HOME="$RUNNER_TEMP/fakehome"
          FAKE_BIN="$FAKE_HOME/.local/bin"
          PS_PROFILE="$FAKE_HOME/.config/powershell/Microsoft.PowerShell_profile.ps1"
          PATH_LINE="export PATH=\"$FAKE_BIN:\$PATH\""
          # 保险库替身：卸载默认必须把它留在原地
          mkdir -p "$FAKE_HOME/.ells"
          printf 'fake-vault' > "$FAKE_HOME/.ells/vault.bin"
          LC_ALL=C LANG=C \
          ELLS_VERSION=v0.0.0-test ELLS_DOWNLOAD_URL=http://127.0.0.1:18098 \
            HOME="$FAKE_HOME" ELLS_INSTALL_DIR="$FAKE_BIN" \
            /bin/sh install.sh
          test -x "$FAKE_BIN/ells"
          test -L "$FAKE_BIN/s"
          grep -qF '# ells: short command s' "$PS_PROFILE"
          echo "install.sh smoke OK"
          LC_ALL=C LANG=C HOME="$FAKE_HOME" ELLS_INSTALL_DIR="$FAKE_BIN" /bin/sh uninstall.sh
          test ! -e "$FAKE_BIN/ells"
          test ! -L "$FAKE_BIN/s"
          # set -e 下 "! cmd" 不会让步骤失败，断言一律写成显式 if
          if grep -qF "$PATH_LINE" "$FAKE_HOME/.zshrc" "$FAKE_HOME/.bashrc" "$FAKE_HOME/.profile" 2>/dev/null; then
            echo "PATH 配置没清干净" >&2; exit 1
          fi
          if grep -qF '# ells: short command s' "$PS_PROFILE"; then
            echo "PowerShell 里的 s 函数没清干净" >&2; exit 1
          fi
          test -f "$FAKE_HOME/.ells/vault.bin"
          echo "uninstall.sh smoke OK (vault kept)"
          LC_ALL=C LANG=C HOME="$FAKE_HOME" ELLS_INSTALL_DIR="$FAKE_BIN" /bin/sh uninstall.sh --purge
          test ! -e "$FAKE_HOME/.ells"
          echo "uninstall.sh --purge smoke OK"
